<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7A85"/>
      <stop offset="55%" stop-color="#FF5F6D"/>
      <stop offset="100%" stop-color="#E24352"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BE0D0"/>
      <stop offset="100%" stop-color="#38C4B4"/>
    </linearGradient>
    <radialGradient id="lensGrad" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#2E3F5E"/>
      <stop offset="70%" stop-color="#17233C"/>
      <stop offset="100%" stop-color="#0B1424"/>
    </radialGradient>
    <radialGradient id="lensGlass" cx="0.35" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#8FD9FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3B6A9E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#17233C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFB4A8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFB4A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="490" rx="105" ry="14" fill="#17233C" opacity="0.12"/>

  <!-- Map pin body -->
  <path d="M 200 60 C 120 60, 60 120, 60 210 C 60 270, 90 315, 130 345 C 155 365, 175 390, 190 430 C 195 445, 198 468, 200 480 C 202 468, 205 445, 210 430 C 225 390, 245 365, 270 345 C 310 315, 340 270, 340 210 C 340 120, 280 60, 200 60 Z"
    fill="url(#bodyGrad)" stroke="#17233C" stroke-width="6" stroke-linejoin="round"/>

  <!-- Face panel -->
  <ellipse cx="200" cy="215" rx="95" ry="90" fill="#FFF9F2" opacity="0.55"/>

  <!-- Cheeks -->
  <circle cx="138" cy="230" r="16" fill="url(#cheekGrad)"/>
  <circle cx="262" cy="230" r="16" fill="url(#cheekGrad)"/>

  <!-- Eyes with sparkle -->
  <ellipse cx="165" cy="200" rx="14" ry="17" fill="#17233C"/>
  <ellipse cx="235" cy="200" rx="14" ry="17" fill="#17233C"/>
  <circle cx="169" cy="195" r="4.5" fill="#FFF9F2"/>
  <circle cx="239" cy="195" r="4.5" fill="#FFF9F2"/>
  <circle cx="162" cy="207" r="2" fill="#FFF9F2" opacity="0.85"/>
  <circle cx="232" cy="207" r="2" fill="#FFF9F2" opacity="0.85"/>

  <!-- Focused small smile -->
  <path d="M 188 245 Q 200 254 212 245" fill="none" stroke="#17233C" stroke-width="4" stroke-linecap="round"/>

  <!-- Arms -->
  <path d="M 90 305 Q 70 320 85 345 Q 105 355 125 340" fill="#FF5F6D" stroke="#17233C" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 310 305 Q 330 320 315 345 Q 295 355 275 340" fill="#FF5F6D" stroke="#17233C" stroke-width="5" stroke-linejoin="round"/>

  <!-- Cross-body camera bag (lens motif) -->
  <g transform="translate(200 320) scale(1.5)">
    <path d="M -55 -35 Q -30 -55 0 -50 Q 30 -55 55 -35" fill="none" stroke="#17233C" stroke-width="5" stroke-linecap="round"/>
    <rect x="-38" y="-30" width="76" height="52" rx="10" fill="url(#bagGrad)" stroke="#17233C" stroke-width="4"/>
    <path d="M -38 -18 Q 0 -8 38 -18" fill="none" stroke="#17233C" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="0" r="22" fill="url(#lensGrad)" stroke="#17233C" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#45D6C6" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="12" fill="url(#lensGlass)"/>
    <ellipse cx="-4" cy="-5" rx="4" ry="3" fill="#FFF9F2" opacity="0.9"/>
    <circle cx="28" cy="-20" r="3" fill="#FFC857"/>
  </g>

  <!-- Highlight -->
  <ellipse cx="150" cy="115" rx="30" ry="18" fill="#FFF9F2" opacity="0.35" transform="rotate(-25 150 115)"/>

  <!-- Feet -->
  <ellipse cx="184" cy="480" rx="10" ry="6" fill="#17233C"/>
  <ellipse cx="216" cy="480" rx="10" ry="6" fill="#17233C"/>
</svg>
